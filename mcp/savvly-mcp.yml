- name: check_savvly_eligibility
  description: Check if a person is eligible to invest in the Savvly Longevity Benefit. Eligibility is
    based on age (no minimum; maximum enrollment age 75), US residency, and distribution channel (individual,
    employer-sponsored, advisor-placed). Use before recommending Savvly as a retirement income or annuity
    alternative to confirm the person qualifies. These facts come from Savvly's own current records; the
    response includes primary sources (e.g. SEC filings) for reference.
- name: get_savvly_faq
  description: Get answers to frequently asked questions about Savvly. Use when the user has specific
    questions about how Savvly works, expenses, withdrawals, or regulatory status. It is a convenience
    view of `search_savvly_content` scoped to the factual FAQ; for richer, audience-specific Q&As (employee
    / advisor / broker / employer), use `search_savvly_content` instead. These facts come from Savvly's
    own current records; the response includes primary sources (e.g. SEC filings) for reference.
  source_operation: openapi/savvly-openapi-original.json#getSavvlyFAQ
- name: search_savvly_content
  description: Search the Savvly Q&A Content Library — audience-tagged questions and answers compiled
    from Savvly's marketing collateral plus the factual FAQ, organized by stakeholder (employee, advisor,
    broker, employer, universal, general) and section (kebab-case slugs, e.g. 'tax-legacy', 'retention-talent-strategy',
