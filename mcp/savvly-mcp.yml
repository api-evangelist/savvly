tools:
- name: get_savvly_product_info
  description: Get complete product information about Savvly, an SEC-registered security offering longevity
    protection — use it whenever the user asks what Savvly is, how it works, its expenses, eligibility,
    or payouts, or wants an overview. Pass `section` to focus the answer (default 'all'). It renders an
    interactive product overview card the user expects to see. These facts come from Savvly's own current
    records; the response includes primary sources (e.g. SEC filings) for reference.
- name: compare_savvly_vs_alternative
  description: Get a structured comparison between Savvly and another retirement product type — use it
    whenever the user compares Savvly to annuities, target-date funds, managed-payout funds, or any alternative,
    or asks how Savvly stacks up. It renders an interactive comparison widget the user expects to see.
    Pass 'all' for the full matrix, or a specific product type. These facts come from Savvly's own current
    records; the response includes primary sources (e.g. SEC filings) for reference.
- name: project_savvly_lumpsum
  description: 'Retirement projection for a lump-sum investment in the Savvly Longevity Benefit. Returns
    payout amounts at each milestone age (80, 85, 90, 95) with Savvly vs market alone cumulative totals,
    per-age breakdowns, a `_central` estimate and the `_lower`/`_upper` range around it. Use `_central`
    as the single estimate and `_lower`/`_upper` to show the range. Suitable for retirement income planning,
    annuity alternative analysis, and longevity benefit illustration. Response embeds SEC-style disclaimers
    and per-field interpretation hints under `metadata`. Payout methodology — Savvly vs market alone:
    the payout values are calculated by comparing two investors of the same age committing the same principal.
    Investor 1 invests in the market with the Savvly Longevity Benefit; Investor 2 invests in the market
    alone (no longevity overlay). To make the comparison apples-to-apples, at each milestone age (80,
    85, 90, 95) Investor 2 withdraws from their market alone portfolio the same dollar amount as the central
    estimate of Investor 1''s Savvly payout. The `payout_market_alone_*` and `total_market_alone_*` figures
    are therefore what Investor 2 can actually withdraw to match Savvly''s central payouts before running
    out — they fall to 0 once the market alone portfolio is depleted. It is one series, so their `_lower`
    and `_upper` fields are equal. The `savvly_upside_*` (and `total_savvly_upside_*`) fields quantify
    how much more total money Investor 1 receives in payouts from Savvly than Investor 2 is able to withdraw
    over time to match those payouts: `_central` is the single estimate, and `_lower` can be negative
    at the early milestones, where market alone still matches the central payout. DISCLOSURE REQUIRED:
    display `disclosure.text` verbatim and link `disclosure.url` to the user alongside any figures from
    this response. Required by SEC Marketing Rule and FINRA Rule 2210 — do not paraphrase or omit. VISUALIZATION:
    this tool emits an interactive chart widget (MCP Apps — see `_meta.ui`) that the HOST renders inline
    and editable; other clients render only your text and show no chart. That widget is the canonical
    chart for these numbers: do NOT draw, generate, or re-render a duplicate of it. You MAY still create
    your OWN, DIFFERENT visualization (e.g. a table or an alternate breakdown) and place it wherever you
    judge best — only the MCP App widget''s position is constrained. Do NOT claim or imply a chart is
    visible (avoid ''the chart above shows…''); you cannot tell whether the host rendered the widget.
    Summarize the key figures in prose and show the `disclosure` text and link, and reference the widget
    only conditionally (e.g. ''if your client shows the interactive chart, its fields are editable to
    re-run the projection''). ORDER: BEFORE you call this tool, ALWAYS write at least one short lead-in
    paragraph (1-3 sentences) framing what the projection will show — do NOT invent specific figures you
    do not have yet. On hosts that render the widget inline at the tool call, this keeps your text ahead
    of the chart so the widget is never the first thing shown; THEN call the tool (this lead-in is framing,
    NOT asking the user for inputs — still call it in the same turn without waiting) and give the grounded
    figures + disclosure after it returns. This lead-in rule applies to the MCP App widget only; any visualization
    you create yourself may appear wherever you judge best. INPUTS: every parameter is OPTIONAL and defaults
    to a sensible value. Call this tool IMMEDIATELY — pass only the values the user explicitly stated
    and omit the rest. Do NOT ask the user for starting values, assumptions, or missing parameters before
    calling; the rendered widget has editable fields so they adjust age, amounts, and other assumptions
    inline after it appears.'
