  description: First-party Savvly MCP server exposing the Savvly Public API (product data, projections,
    comparisons, eligibility, FAQ) to AI agents. No authentication; rate-limited. Also distributed as
    npm @savvly/mcp-server, PyPI savvly-mcp-server, NuGet Savvly.McpServer, and Docker ghcr.io/savvly/savvly-mcp-server
    (see packages/savvly-packages.yml).
install:
  remote: https://api.savvly.com/mcp
  npm: npx @savvly/mcp-server
  pypi: uvx savvly-mcp-server
